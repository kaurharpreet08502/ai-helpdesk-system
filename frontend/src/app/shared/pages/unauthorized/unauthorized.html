<div class="unauthorized-container">

    <div class="card">

        <mat-icon class="icon">

            lock

        </mat-icon>

        <h1>

            403

        </h1>

        <h2>

            Access Denied

        </h2>

        <p>

            You do not have permission to access this page.

        </p>

        <div class="actions">

            <button
                mat-raised-button
                color="primary"
                (click)="goToDashboard()">

                Go To Dashboard

            </button>

            <button
                mat-stroked-button
                color="warn"
                (click)="logout()">

                Back To Login

            </button>

        </div>

    </div>

</div>
