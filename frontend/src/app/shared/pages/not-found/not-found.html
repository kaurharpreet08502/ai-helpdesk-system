<div class="not-found-container">

    <div class="card">

        <mat-icon class="icon">

            travel_explore

        </mat-icon>

        <h1>

            404

        </h1>

        <h2>

            Page Not Found

        </h2>

        <p>

            The page you are looking for doesn't exist or has been moved.

        </p>

        <div class="actions">

            <button
                mat-raised-button
                color="primary"
                (click)="goHome()">

                Go To Dashboard

            </button>

            <button
                mat-stroked-button
                (click)="goBack()">

                Go Back

            </button>

        </div>

    </div>

</div>
